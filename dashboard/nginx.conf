server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static dashboard files
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Reverse-proxy /api/* to the collector service over the Docker network.
    # "collector" is the service/container name and is resolved by Docker DNS.
    location /api/ {
        proxy_pass http://collector-service:6000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Strip the /api prefix so /api/status becomes /status on the collector
        rewrite ^/api/(.*)$ /$1 break;
    }

    # Health check
    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
